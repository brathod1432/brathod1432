<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" role="img" aria-label="RBG Candidate">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1429"/><stop offset="1" stop-color="#171236"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
<radialGradient id="glow" cx="75%" cy="45%" r="55%"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.lb{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:#7c5cff}
.t{font-size:22px;font-weight:700;fill:#fff}
.d{font-size:12.5px;fill:#aab0d6}
.chip{fill:#1b2145;stroke:#2d3566}
.ct{font-size:10.5px;font-weight:600;fill:#cfd4ff}
.stroke{fill:none;stroke:url(#ac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:url(#ac)}
.soft{fill:#232a57}
.fl{animation:fl 5s ease-in-out infinite;animation-delay:1.6s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.8s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
.dash{stroke-dasharray:4 6;animation:ds 1.6s linear infinite}
@keyframes ds{to{stroke-dashoffset:-20}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:br 3.4s ease-in-out infinite}
@keyframes br{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.scan{animation:sc 3.2s ease-in-out infinite}
@keyframes sc{0%,100%{transform:translateY(0)}50%{transform:translateY(62px)}}
.blink{animation:bk 3s steps(1) infinite}
@keyframes bk{0%,60%{opacity:1}61%,100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:gr 4s ease-in-out infinite}
@keyframes gr{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{animation:sw 5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-460px)}100%{transform:translateX(460px)}}
</style>
<clipPath id="r"><rect width="440" height="200" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="440" height="200" fill="url(#bg)"/>
<rect width="440" height="200" fill="url(#glow)"/>
<rect class="sw" x="0" y="0" width="120" height="2" fill="url(#ac)" opacity=".9"/>
<rect x="0" y="0" width="5" height="200" fill="url(#ac)"/>
<text x="26" y="40" class="lb">BROWSER EXTENSION</text>
<text x="26" y="72" class="t">RBG Candidate</text>
<text x="26" y="98" class="d">Privacy-first form filling</text><text x="26" y="117" class="d">with AI. Encrypted on-device,</text><text x="26" y="136" class="d">reviewed before any fill.</text>
<g><rect x="26" y="156" width="38" height="22" rx="11" class="chip"/><text x="45" y="171" text-anchor="middle" class="ct">MV3</text></g><g><rect x="71.8" y="156" width="64" height="22" rx="11" class="chip"/><text x="104" y="171" text-anchor="middle" class="ct">FastAPI</text></g><g><rect x="144.0" y="156" width="64" height="22" rx="11" class="chip"/><text x="176" y="171" text-anchor="middle" class="ct">AES-GCM</text></g>
<g transform="translate(262,34)"><g class="fl">
<rect x="8" y="8" width="132" height="116" rx="10" class="soft" stroke="#2f3770"/>
<rect x="20" y="22" width="40" height="5" rx="2.5" fill="#39428a"/>
<rect x="20" y="32" width="108" height="16" rx="5" fill="#0f1429" stroke="#39428a"/><rect class="grow fill" x="26" y="38" width="70" height="4" rx="2"/>
<rect x="20" y="58" width="40" height="5" rx="2.5" fill="#39428a"/>
<rect x="20" y="68" width="108" height="16" rx="5" fill="#0f1429" stroke="#39428a"/><rect class="grow fill" x="26" y="74" width="52" height="4" rx="2" style="animation-delay:.8s"/>
<rect x="20" y="94" width="64" height="20" rx="10" class="fill"/><text x="52" y="108" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#0b0f1f">Review</text>
</g><g transform="translate(112,84)"><rect x="0" y="12" width="30" height="24" rx="5" fill="#0f1429" stroke="url(#ac)" stroke-width="2"/><path d="M7 12V8a8 8 0 0 1 16 0v4" class="stroke"/><circle cx="15" cy="24" r="3" class="fill pu"/></g></g>
</g>
<rect x=".5" y=".5" width="439" height="199" rx="18" fill="none" stroke="#2a2f58"/>
</svg>