<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" role="img" aria-label="oc_toolkit">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1429"/><stop offset="1" stop-color="#171236"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
<radialGradient id="glow" cx="75%" cy="45%" r="55%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.lb{font-size:10.5px;font-weight:700;letter-spacing:1.6px;fill:#7c5cff}
.t{font-size:22px;font-weight:700;fill:#fff}
.d{font-size:12.5px;fill:#aab0d6}
.chip{fill:#1b2145;stroke:#2d3566}
.ct{font-size:10.5px;font-weight:600;fill:#cfd4ff}
.stroke{fill:none;stroke:url(#ac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:url(#ac)}
.soft{fill:#232a57}
.fl{animation:fl 5s ease-in-out infinite;animation-delay:0.8s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.8s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
.dash{stroke-dasharray:4 6;animation:ds 1.6s linear infinite}
@keyframes ds{to{stroke-dashoffset:-20}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:br 3.4s ease-in-out infinite}
@keyframes br{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.scan{animation:sc 3.2s ease-in-out infinite}
@keyframes sc{0%,100%{transform:translateY(0)}50%{transform:translateY(62px)}}
.blink{animation:bk 3s steps(1) infinite}
@keyframes bk{0%,60%{opacity:1}61%,100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:gr 4s ease-in-out infinite}
@keyframes gr{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{animation:sw 5s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-460px)}100%{transform:translateX(460px)}}
</style>
<clipPath id="r"><rect width="440" height="200" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="440" height="200" fill="url(#bg)"/>
<rect width="440" height="200" fill="url(#glow)"/>
<rect class="sw" x="0" y="0" width="120" height="2" fill="url(#ac)" opacity=".9"/>
<rect x="0" y="0" width="5" height="200" fill="url(#ac)"/>
<text x="26" y="40" class="lb">MULTI-AGENT TOOLKIT</text>
<text x="26" y="72" class="t">oc_toolkit</text>
<text x="26" y="98" class="d">Drop-in agents and skills</text><text x="26" y="117" class="d">for Open Code, orchestrated</text><text x="26" y="136" class="d">by RBG_Runner.</text>
<g><rect x="26" y="156" width="77" height="22" rx="11" class="chip"/><text x="65" y="171" text-anchor="middle" class="ct">12 agents</text></g><g><rect x="111.4" y="156" width="84" height="22" rx="11" class="chip"/><text x="153" y="171" text-anchor="middle" class="ct">scheduling</text></g><g><rect x="203.4" y="156" width="58" height="22" rx="11" class="chip"/><text x="232" y="171" text-anchor="middle" class="ct">skills</text></g>
<g transform="translate(262,34)"><g class="fl">
<line x1="76" y1="62" x2="26" y2="22" class="stroke dash" opacity=".7"/>
<line x1="76" y1="62" x2="130" y2="22" class="stroke dash" opacity=".7"/>
<line x1="76" y1="62" x2="26" y2="106" class="stroke dash" opacity=".7"/>
<line x1="76" y1="62" x2="130" y2="106" class="stroke dash" opacity=".7"/>
<line x1="76" y1="62" x2="76" y2="8" class="stroke dash" opacity=".7"/>
<circle cx="76" cy="62" r="26" class="spin" fill="none" stroke="#39428a" stroke-dasharray="3 6"/>
<circle cx="76" cy="62" r="19" fill="#0f1429" stroke="url(#ac)" stroke-width="2.5"/>
<path d="M69 62h14M76 55v14" class="stroke"/>
<circle cx="26" cy="22" r="9" class="soft" stroke="url(#ac)"/><circle cx="130" cy="22" r="9" class="soft" stroke="url(#ac)"/>
<circle cx="26" cy="106" r="9" class="soft" stroke="url(#ac)"/><circle cx="130" cy="106" r="9" class="soft" stroke="url(#ac)"/>
<circle cx="76" cy="8" r="7" class="soft" stroke="url(#ac)"/>
<circle class="pu fill" cx="26" cy="22" r="3"/><circle class="pu fill" cx="130" cy="106" r="3" style="animation-delay:1s"/>
</g></g>
</g>
<rect x=".5" y=".5" width="439" height="199" rx="18" fill="none" stroke="#2a2f58"/>
</svg>