<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 14" width="860" height="14" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      .shine { animation: move 4.5s ease-in-out infinite; }
      .gem { transform-origin: 430px 7px; animation: breathe 3s ease-in-out infinite; }
      @keyframes move { 0% { transform: translateX(-200px); } 100% { transform: translateX(860px); } }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1) rotate(45deg); } 50% { opacity: 1; transform: scale(1.25) rotate(45deg); } }
    </style>
  </defs>
  <rect x="0" y="6.5" width="860" height="1" fill="url(#base)"/>
  <rect class="shine" x="0" y="6" width="200" height="2" fill="url(#shine)"/>
  <rect class="gem" x="426" y="3" width="8" height="8" rx="1.5" fill="#7c5cff"/>
</svg>
